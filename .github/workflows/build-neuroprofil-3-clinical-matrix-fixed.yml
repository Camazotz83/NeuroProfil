name: NeuroProfil 3.0 — Clinical Matrix APK FIXED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract NeuroProfil 3
        run: |
          rm -rf neuroprofil3
          mkdir neuroprofil3
          unzip -q NeuroProfil_3_0_ClinicalMatrix_Android.zip -d neuroprofil3

      - name: Optional imprint configuration
        run: |
          if [ -f neuroprofil-impressum.js ]; then
            cp neuroprofil-impressum.js neuroprofil3/app/src/main/assets/config.js
            echo "Using repository imprint configuration."
          else
            echo "No neuroprofil-impressum.js found — build keeps the visible imprint placeholders."
          fi
          grep -n "imprint\|paypal" neuroprofil3/app/src/main/assets/config.js || true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p neuroprofil3 clean :app:assembleRelease --no-daemon

      - name: Verify package
        run: |
          cp neuroprofil3/app/build/outputs/apk/release/app-release.apk NeuroProfil-3.0.0-ClinicalMatrix.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging NeuroProfil-3.0.0-ClinicalMatrix.apk | tee badging.txt
          grep -q "package: name='de.neuroprofil.clinicalmatrix'" badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose NeuroProfil-3.0.0-ClinicalMatrix.apk

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Real install and launch test on Android 14
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            adb install NeuroProfil-3.0.0-ClinicalMatrix.apk
            adb shell pm path de.neuroprofil.clinicalmatrix
            adb shell am start -W -n de.neuroprofil.clinicalmatrix/de.neuroprofil.app.MainActivity
            sleep 3
            adb shell pidof de.neuroprofil.clinicalmatrix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroProfil-3.0.0-ClinicalMatrix-APK
          path: NeuroProfil-3.0.0-ClinicalMatrix.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-clinical-matrix
          name: NeuroProfil 3.0.0 — Clinical Matrix
          body: |
            Clinical Matrix release.
            Build/package verification passed and the APK must install and launch
            successfully on an Android 14 / API 34 emulator before publication.
          files: NeuroProfil-3.0.0-ClinicalMatrix.apk
