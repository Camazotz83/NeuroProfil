name: NeuroProfil 4.0 — Preview APK FIXED 2

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf neuroprofil4
          mkdir neuroprofil4
          unzip -q NeuroProfil_4_0_EvidenceStudio_Android.zip -d neuroprofil4
          test -f neuroprofil4/app/build.gradle
          test -f neuroprofil4/app/src/main/AndroidManifest.xml

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          echo "SDK root: $SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          # Make newly installed Android tools available to ALL following steps.
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

          # Verify directly by absolute path in this same step.
          test -x "$SDK_ROOT/platform-tools/adb"
          "$SDK_ROOT/platform-tools/adb" version
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt2"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p neuroprofil4 clean :app:assembleDebug --no-daemon --stacktrace
          test -s neuroprofil4/app/build/outputs/apk/debug/app-debug.apk
          cp neuroprofil4/app/build/outputs/apk/debug/app-debug.apk NeuroProfil-4.0.0-preview.apk

      - name: Inspect APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt2"
          "$AAPT" dump badging NeuroProfil-4.0.0-preview.apk | tee badging.txt
          grep -q "package: name='de.neuroprofil.clinicalmatrix.debug'" badging.txt
          grep -q "targetSdkVersion:'36'" badging.txt

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install + launch test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            ADB="$SDK_ROOT/platform-tools/adb"
            "$ADB" wait-for-device
            "$ADB" shell getprop ro.build.version.release
            "$ADB" shell getprop ro.build.version.sdk
            "$ADB" install -r NeuroProfil-4.0.0-preview.apk
            "$ADB" shell pm path de.neuroprofil.clinicalmatrix.debug
            "$ADB" shell am start -W -n de.neuroprofil.clinicalmatrix.debug/de.neuroprofil.app.MainActivity
            sleep 4
            "$ADB" shell pidof de.neuroprofil.clinicalmatrix.debug

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroProfil-4.0.0-preview-APK
          path: NeuroProfil-4.0.0-preview.apk
          if-no-files-found: error
