name: NeuroProfil 4.0 — Preview APK

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          rm -rf neuroprofil4
          mkdir neuroprofil4
          unzip -q NeuroProfil_4_0_EvidenceStudio_Android.zip -d neuroprofil4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle -p neuroprofil4 clean :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp neuroprofil4/app/build/outputs/apk/debug/app-debug.apk NeuroProfil-4.0.0-preview.apk
      - name: Android 16 install + launch test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            adb install NeuroProfil-4.0.0-preview.apk
            adb shell am start -W -n de.neuroprofil.clinicalmatrix.debug/de.neuroprofil.app.MainActivity
            sleep 3
            adb shell pidof de.neuroprofil.clinicalmatrix.debug
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroProfil-4.0.0-preview-APK
          path: NeuroProfil-4.0.0-preview.apk
